name: Build Joomla Language Pack

on:
  push:
    branches: [j5, j6]
    tags: ['*']
  pull_request:
    branches: [j5, j6]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: j5
            artifact: pkg_ms-MY_j5.zip
          - target: j6
            artifact: pkg_ms-MY_j6.zip
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build language pack (${{ matrix.target }})
        run: |
          ./build.ps1 -ConfigPath build/build.config.json

      - name: Verify target artifact
        shell: pwsh
        run: |
          $path = "dist/${{ matrix.artifact }}"
          if (-not (Test-Path $path) -or (Get-Item $path).Length -le 0) { throw "Artifact ontbreekt: $path" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-language-pack
          path: dist/${{ matrix.artifact }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'j5'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
